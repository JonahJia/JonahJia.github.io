<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title != 'Home' %}{{ page.title }} | {% endif %}Junhao Jia</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta property="og:title" content="Junhao Jia | Academic Homepage">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{ site.data.homepage.portrait | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="{{ site.data.homepage.portrait | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
  <script src="{{ '/assets/js/academic.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
</head>
<body id="home">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <nav class="site-nav" aria-label="Main navigation"><div class="nav-inner">
    <a class="site-name" href="{{ '/#home' | relative_url }}">Junhao Jia</a>
    <div class="nav-links">{% for item in site.data.navigation.pages %}<a href="{{ item.url | relative_url }}" data-section="{{ item.section }}"{% if item.name == page.navbar_title %} aria-current="location"{% endif %}>{{ item.name }}</a>{% endfor %}</div>
  </div></nav>
  <main id="main-content" class="site-container">{{ content }}</main>
  <footer class="site-footer"><span>Junhao Jia</span><span>Built with <a href="https://github.com/luost26/academic-homepage" target="_blank" rel="noopener noreferrer">academic-homepage</a> · <a href="https://github.com/JonahJia/JonahJia.github.io" target="_blank" rel="noopener noreferrer">Source</a></span></footer>
  <dialog class="figure-dialog" id="figure-dialog" aria-labelledby="figure-caption">
    <button type="button" class="dialog-close" aria-label="Close framework image">×</button>
    <img id="figure-full" alt="">
    <p id="figure-caption"></p>
  </dialog>
</body>
</html>
