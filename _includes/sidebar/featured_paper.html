{% assign paper = include.paper %}
<article class="work-card featured-paper" id="paper-{{ paper.id }}">
  <div class="work-media">
    <span class="badge">{% include academic/venue_label.html paper=paper %}</span>
    <a class="figure-trigger" href="{{ paper.cover | relative_url }}" data-figure-caption="{{ paper.title | escape }}" aria-label="Enlarge framework diagram for {{ paper.title | escape }}"><img src="{{ paper.cover | relative_url }}" alt="{{ paper.alt | escape }}" loading="lazy"></a>
  </div>
  <div class="work-body">
    <h3 class="work-title"><a href="{{ paper.links.Paper }}" target="_blank" rel="noopener noreferrer">{{ paper.title }}</a></h3>
    {% include academic/authors.html paper=paper %}
    <p class="work-venue"><i>{{ paper.conference }}</i></p>
  </div>
</article>
