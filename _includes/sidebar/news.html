<h1 class="section-title" id="news">🔥 News</h1>
<div class="scroll-box" tabindex="0" role="region" aria-label="News, scroll for earlier updates"><ul class="date-list">
{% for item in site.data.updates %}<li><time class="item-date" datetime="{{ item.date | replace: '.', '-' }}">{{ item.date }}:</time><span class="item-body"><span aria-hidden="true">🎉🎉</span> Our paper for <a href="{{ item.url }}" target="_blank" rel="noopener noreferrer">{{ item.venue }}</a> {% if item.kind == 'award' %}was selected as an{% elsif item.kind == 'oral' %}was selected for{% else %}was{% endif %} <strong>{{ item.label }}</strong></span></li>{% endfor %}
</ul></div><div class="scroll-hint"><span aria-hidden="true">⬆</span> Scrollable</div>
