<section id="open-source" class="academic-section" aria-label="Open Source">
  {% if include.sidebar %}<h1 class="section-title">🛠️ Open Source</h1>{% else %}<h2 class="section-heading" id="opensource-heading"><span aria-hidden="true">🛠️</span> Open Source</h2>{% endif %}
  {% for project in site.data.open_source %}{% assign repository_url = 'https://github.com/' | append: project.repository %}
  <div class="surface open-source-card">
    <h3><a href="{{ repository_url }}" target="_blank" rel="noopener noreferrer">{{ project.name }}</a></h3>
    <p>{{ project.description }}</p>
    <div class="repository-badges">
      <a href="{{ repository_url }}/stargazers" target="_blank" rel="noopener noreferrer"><img src="https://img.shields.io/github/stars/{{ project.repository }}?style=flat-square&amp;label=Stars&amp;color=660874" alt="GitHub stars" loading="lazy" height="20"></a>
      <a href="{{ repository_url }}/forks" target="_blank" rel="noopener noreferrer"><img src="https://img.shields.io/github/forks/{{ project.repository }}?style=flat-square&amp;label=Forks&amp;color=526078" alt="GitHub forks" loading="lazy" height="20"></a>
    </div>
  </div>
  {% endfor %}
</section>
