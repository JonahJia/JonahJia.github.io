{% assign paper = include.paper %}
<article class="surface paper-card" id="paper-{{ paper.id }}">
  <div class="paper-visual">
    <span class="venue-badge">{% include academic/venue_label.html paper=paper %}</span>
    <a href="{{ paper.cover | relative_url }}" class="figure-trigger" data-figure-caption="{{ paper.title | escape }}" aria-label="Enlarge framework diagram for {{ paper.title | escape }}">
      <img src="{{ paper.cover | relative_url }}" alt="{{ paper.alt | escape }}" loading="lazy">
      <span class="figure-zoom">View framework <svg class="external-icon" aria-hidden="true" viewBox="0 0 16 16"><path d="M4 12 12 4M4 4h8v8"/></svg></span>
    </a>
  </div>
  <div class="paper-copy">
    <h3><a href="{{ paper.links.Paper }}" target="_blank" rel="noopener noreferrer">{{ paper.title }}</a></h3>
    {% include academic/authors.html paper=paper %}
    <p class="conference-name">{{ paper.conference }}</p>
  </div>
</article>
